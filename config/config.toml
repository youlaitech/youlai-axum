[rate_limit]
# 是否启用全局 IP 限流中间件
enabled = true
# 普通接口在窗口内允许的最大请求数
limit = 1000
# 滑动窗口大小（秒）
window_seconds = 60
# 严格路径在窗口内允许的最大请求数
strict_limit = 5
# 需要更严格限流的路径前缀列表（登录改由按账号 5/60s 限流，见 auth::login）
strict_paths = ""
