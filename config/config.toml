[security]
ignore_urls = "/api/v1/auth/login/**,/api/v1/auth/captcha,/api/v1/auth/sms/code,/api/v1/auth/refresh-token,/api/v1/auth/qr-code/generate,/api/v1/auth/qr-code/status,/api/v1/auth/qr-code/login,/api/v1/wxma/auth/**,/doc.html,/swagger-ui,/swagger-ui/*,/openapi.json"
unsecured_urls = ""

[security.session]
type = "jwt"
access_token_time_to_live = 7200
refresh_token_time_to_live = 604800

[security.session.jwt]
secret_key = "SecretKey012345678901234567890123456789012345678901234567890123456789"

[security.session.redis_token]
allow_multi_login = true

[file]
type = "minio"

[file.upload]
max_file_size_mb = 50
allowed_extensions = "jpg,jpeg,png,gif"

[file.minio]
endpoint = "http://111.229.83.153:9000"
