services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    depends_on: [postgres, redis, rustfs]
    environment:
      DATABASE__URL: postgres://postgres:123456@postgres:5432/youlai_admin
      REDIS__URL: redis://redis:6379/0
      FILE__TYPE: s3
      FILE__S3__ENDPOINT: http://rustfs:9000
      FILE__S3__ACCESS_KEY: rustfs-admin
      FILE__S3__SECRET_KEY: rustfs-admin
      FILE__S3__BUCKET: public
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: youlai_admin
      POSTGRES_PASSWORD: "123456"
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # RustFS：S3 协议兼容的对象存储服务（MinIO 停止维护后的开源替代）
  rustfs:
    image: rustfs/rustfs:latest
    ports: ["9000:9000", "9001:9001"]
    command: server /data --console-address ":9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfs-admin
      RUSTFS_SECRET_KEY: rustfs-admin
    volumes: ["rustfs_data:/data"]

volumes:
  pg_data:
  rustfs_data:
