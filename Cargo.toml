[package]
name = "youlai-axum"
version = "0.2.3"
edition = "2021"
description = "youlai-axum admin backend — Axum + SeaORM + PostgreSQL"
license = "Apache-2.0"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# Web 框架
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit"] }

# ORM + PostgreSQL
sea-orm = { version = "1.1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-uuid",
] }
sea-orm-migration = "1.1"

# Redis
redis = { version = "0.28", features = ["tokio-comp", "connection-manager"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 配置
toml = "0.8"

# 日志 / 链路追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# API 文档
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "reqwest"] }

# 认证 / 加密
jsonwebtoken = "9"
bcrypt = "0.16"
rand = "0.8"
captcha = "0.0.9"
base64 = "0.22"

# 数据校验
validator = { version = "0.20", features = ["derive"] }

# Excel
calamine = "0.26"
rust_xlsxwriter = "0.79"

# 对象存储 (S3 / RustFS)
aws-sdk-s3 = "1"

# 邮件
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
] }
tera = "1"
# 代码生成 zip 打包
zip = "2"

# 工具
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
once_cell = "1"
dotenvy = "0.15"
async-trait = "0.1"
strum = { version = "0.26", features = ["derive"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# HTTP 客户端（调用微信小程序开放接口）
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
